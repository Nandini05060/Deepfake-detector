name: lx-dfd
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - matplotlib
  - pillow
  - pyyaml
  - pip:
    - timm
    - albumentations
    - opencv-python
    - imagehash
    - pytorch-grad-cam
    - fastapi
    - uvicorn
    - python-multipart
